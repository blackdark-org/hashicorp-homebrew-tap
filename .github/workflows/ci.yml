name: CI
# Builds/tests the Go tooling and audits every Formula and Cask file with `brew audit`.
on:
  pull_request:
  push:
    paths:
      - util/**

# Triggering on both pull_request and push will cause duplicate workflows to fire. We only need one
# This occurs when we create a branch on the repository and then makes a PR from it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-templater:
    name: Build Formula Templater
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      -
        name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: util/formula_templater/go.sum
          go-version-file: util/formula_templater/go.mod

      - name: Build CLI
        run: cd util/formula_templater && go build

      - name: Test
        run: cd util/formula_templater && go test ./...

  lint-formulae:
    name: Audit Formulae and Casks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 #2026.09.13.1

      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/../Taps/local"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/../Taps/local/homebrew-tap"

      - name: Audit
        run: brew audit --strict --tap=local/tap

      - name: Verify sha256 of changed formulae/casks against the real download
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- 'Formula/*.rb' 'Casks/hashicorp-*.rb')
          if [[ -z "$changed" ]]; then
            echo "::notice::No Formula/Cask changes on this branch."
            exit 0
          fi

          # brew fetch resolves formulae by qualified tap name, which needs a
          # real `brew tap` registration - the plain symlink used for `brew
          # audit` above isn't enough for name resolution. Tap straight from
          # this checkout over file:// so it fetches the files as they exist
          # right now, not a stale clone.
          rm -f "$(brew --repository)/../Taps/local/homebrew-tap"
          brew tap local/tap "file://$GITHUB_WORKSPACE"

          for f in $changed; do
            case "$f" in
              Casks/hashicorp-*.rb)
                cask_token=$(basename "$f" .rb)
                ;;
              *)
                product=$(basename "$f" .rb)
                ;;
            esac
            case "$f" in
              Casks/*)
                # Casks are macOS-only (depends_on :macos) so brew fetch --cask
                # can't run for real on this Linux runner - it always fails with
                # "not supported on os linux", unrelated to sha256 correctness.
                # Warn instead of failing the job; verify casks by hand on macOS
                # before merging, or add a macos-latest runner if this becomes
                # frequent enough to justify the extra billed minutes.
                echo "::warning::Cannot verify local/tap/$cask_token sha256 on a Linux runner - casks are macOS-only. Verify manually."
                ;;
              *)
                echo "::notice::brew fetch local/tap/$product (verifies sha256 against the live download)"
                brew fetch --formula "local/tap/$product"
                ;;
            esac
          done

