name: CI
# Builds/tests the Go tooling and audits every Formula and Cask file with `brew audit`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "1.7.12"
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.221.1"

jobs:
  build-templater:
    name: Build Formula Templater
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      -
        name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: util/formula_templater/go.sum
          go-version-file: util/formula_templater/go.mod

      - name: Build CLI
        run: cd util/formula_templater && go build

      - name: Test
        run: cd util/formula_templater && go test ./...

  lint-formulae:
    name: Audit Formulae and Casks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 #2026.09.13.1

      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/../Taps/local"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/../Taps/local/homebrew-tap"

      - name: Audit
        run: brew audit --strict --tap=local/tap

      - name: Verify sha256 of changed formulae/casks against the real download
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- 'Formula/*.rb' 'Casks/hashicorp-*.rb')
          if [[ -z "$changed" ]]; then
            echo "::notice::No Formula/Cask changes on this branch."
            exit 0
          fi

          # brew fetch resolves formulae by qualified tap name, which needs a
          # real `brew tap` registration - the plain symlink used for `brew
          # audit` above isn't enough for name resolution. Tap straight from
          # this checkout over file:// so it fetches the files as they exist
          # right now, not a stale clone.
          rm -f "$(brew --repository)/../Taps/local/homebrew-tap"
          brew tap local/tap "file://$GITHUB_WORKSPACE"
          brew trust local/tap

          for f in $changed; do
            case "$f" in
              Casks/hashicorp-*.rb)
                cask_token=$(basename "$f" .rb)
                ;;
              *)
                product=$(basename "$f" .rb)
                ;;
            esac
            case "$f" in
              Casks/*)
                # Casks are macOS-only (depends_on :macos) so brew fetch --cask
                # can't run for real on this Linux runner - it always fails with
                # "not supported on os linux", unrelated to sha256 correctness.
                # Warn instead of failing the job; verify casks by hand on macOS
                # before merging, or add a macos-latest runner if this becomes
                # frequent enough to justify the extra billed minutes.
                echo "::warning::Cannot verify local/tap/$cask_token sha256 on a Linux runner - casks are macOS-only. Verify manually."
                ;;
              *)
                echo "::notice::brew fetch local/tap/$product (verifies sha256 against the live download)"
                brew fetch --formula "local/tap/$product"
                ;;
            esac
          done

  config-lint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  check:
    if: always()
    needs: [build-templater, lint-formulae, config-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
