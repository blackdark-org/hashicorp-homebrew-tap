name: Renovate Sync
# Renovate's regex manager only bumps the `version "..."` line - it has no way to
# recompute per-arch urls/sha256 or the mirror-URL wrapper. This workflow runs
# formula_templater against the bumped version and pushes the fully regenerated
# file back onto the same PR branch.
#
# Pushing with a deploy key (instead of the default GITHUB_TOKEN) is required so the
# push fires a real `synchronize` event - GITHUB_TOKEN-authored pushes are exempted
# from triggering workflows, which would otherwise leave ci.yml never re-running
# against the corrected commit and automerge waiting on stale checks forever.
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate formula/cask from bumped version
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # ssh-key must stay in git config for the later `git push` step to
          # authenticate - persist-credentials:false would break that push.
          ssh-key: ${{ secrets.TAP_SYNC_DEPLOY_KEY }} # zizmor: ignore[artipacked,secrets-outside-env] key is needed by the push step later in this job; no dedicated Environment for this single-secret, low-traffic workflow

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: util/formula_templater/go.mod

      - name: Build formula_templater
        run: cd util/formula_templater && go build

      - name: Regenerate changed Formula/Cask files
        id: regenerate
        run: |
          set -euo pipefail
          git fetch origin main
          # Renovate only ever touches one dependency per PR branch by default,
          # but handle multiple changed files defensively. copywrite.rb/enos.rb
          # are excluded via ignorePaths in renovate.json5 (not in
          # formula_templater's config.hcl), but skip them here too in case
          # something else touches them on the same branch.
          #
          # fetch-depth:0 above ensures origin/main and HEAD share full history
          # so this diff can't silently fail (a shallow clone here previously
          # made `git diff origin/main...HEAD` error with "no merge base",
          # which the old code swallowed as if nothing had changed - the
          # sha256/url regeneration below never ran as a result). git diff's
          # own exit status is captured separately from grep's so a real git
          # failure isn't mistaken for "grep found nothing".
          diffed=$(git diff --name-only origin/main...HEAD -- 'Formula/*.rb' 'Casks/hashicorp-*.rb')
          changed=$(echo "$diffed" | grep -v -e '^Formula/copywrite\.rb$' -e '^Formula/enos\.rb$' || true)
          if [[ -z "$changed" ]]; then
            echo "::notice::No Formula/Cask changes on this branch, nothing to regenerate."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for f in $changed; do
            version=$(grep -m1 -E '^\s*version\s+"' "$f" | sed -E 's/.*"([^"]+)".*/\1/')
            case "$f" in
              Casks/hashicorp-*.rb)
                product=$(basename "$f" .rb | sed 's/^hashicorp-//')
                ;;
              *)
                product=$(basename "$f" .rb)
                ;;
            esac

            echo "::notice::Regenerating $f for $product $version"
            case "$f" in
              Casks/*)
                ./util/formula_templater/formula_templater -cask "$product" "$version" ./util/formula_templater/config.hcl > "$f"
                ;;
              *)
                ./util/formula_templater/formula_templater "$product" "$version" ./util/formula_templater/config.hcl > "$f"
                ;;
            esac
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push regenerated files
        if: steps.regenerate.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "renovate-sync[bot]"
          git config user.email "renovate-sync[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "::notice::formula_templater output is identical to Renovate's PR - nothing to push."
            exit 0
          fi

          git add Formula Casks
          git commit -m "Regenerate formula/cask from bumped version"

          # Push over the deploy key's SSH remote so this counts as a non-GITHUB_TOKEN
          # push and triggers pull_request:synchronize (see header comment above).
          # HEAD_REF is passed through env above (not inlined into this script) to
          # avoid shell injection from an attacker-controlled branch name.
          git push origin "HEAD:${HEAD_REF}"
